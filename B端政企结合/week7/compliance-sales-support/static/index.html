<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>开源情报平台 · B端政企模块</title>
<style>
/* ═══════════════════════════════════════════
   完全对齐 KOL 平台视觉:深色侧边栏 + teal + 紧凑排版
   ═══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:#EEF2F7;color:#111827;font-size:14px;line-height:1.5;height:100vh;overflow:hidden}
.app{display:flex;height:100vh}
/* ── 侧边栏(对齐 KOL sidebar) ── */
.sidebar{width:200px;background:#1B2B3C;flex-shrink:0;display:flex;flex-direction:column}
.nav-logo{padding:18px 16px;border-bottom:0.5px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:#0D9488;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;color:#fff}
.logo-text{font-size:13px;font-weight:600;color:#fff;line-height:1.3}
.logo-sub{font-size:10px;color:#64748B}
.nav-section{padding:8px 0;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12px;color:#94A3B8;cursor:pointer;transition:all .15s;border-left:2px solid transparent;user-select:none}
.nav-item:hover{color:#E2E8F0;background:rgba(255,255,255,.05)}
.nav-item.active{color:#5EEAD4;border-left-color:#0D9488;background:rgba(13,148,136,.12)}
.nav-item .ni{font-size:14px;flex-shrink:0;width:16px;text-align:center}
.nav-group-label{padding:14px 16px 5px;font-size:9px;letter-spacing:.12em;color:#526579;text-transform:uppercase;font-weight:600}
.nav-secondary{border-top:1px solid rgba(255,255,255,.07);margin-top:8px;padding-top:6px}
.nav-footer{padding:12px 16px;border-top:0.5px solid rgba(255,255,255,.08);font-size:10px;color:#475569}
/* ── 主区 ── */
.main-area{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:0.5px solid #E2E8F0;padding:0 20px;height:50px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.topbar-title{font-size:14px;font-weight:600;color:#111827;flex-shrink:0}
.tb-spacer{flex:1}
.tb-btn{font-size:12px;padding:5px 12px;border-radius:5px;border:0.5px solid #E2E8F0;background:#fff;cursor:pointer;color:#374151;font-family:inherit;display:inline-flex;align-items:center;gap:5px;flex-shrink:0;transition:all .15s}
.tb-btn:hover{background:#F8FAFC}
.tb-btn.teal{background:#0D9488;color:#fff;border-color:#0D9488}
.tb-btn.teal:hover{background:#0F766E}
.content{flex:1;overflow-y:auto;padding:20px 20px 40px}
.page{display:none}.page.active{display:block}
/* ── 指标卡(对齐 KOL metric-card) ── */
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.metric-card{background:#fff;border:0.5px solid #E2E8F0;border-radius:9px;padding:14px}
.mc-label{font-size:11px;color:#6B7280;margin-bottom:5px}
.mc-num{font-size:26px;font-weight:600;color:#111827;line-height:1;margin-bottom:4px}
.mc-sub{font-size:10px;color:#9CA3AF}
/* ── 卡片(对齐 KOL card) ── */
.card{background:#fff;border:0.5px solid #E2E8F0;border-radius:9px;overflow:hidden;margin-bottom:12px}
.card-head{padding:11px 14px;border-bottom:0.5px solid #F1F5F9;display:flex;align-items:center;justify-content:space-between}
.ch-title{font-size:12px;font-weight:600;color:#374151;display:flex;align-items:center;gap:6px}
/* ── 徽章(对齐 KOL badge) ── */
.badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;border:0.5px solid;display:inline-block;white-space:nowrap}
.b-green{background:#ECFDF5;color:#047857;border-color:rgba(4,120,87,.25)}
.b-red{background:#FEF2F2;color:#991B1B;border-color:rgba(185,28,28,.25)}
.b-amber{background:#FFFBEB;color:#92400E;border-color:rgba(180,83,9,.25)}
.b-blue{background:#EFF6FF;color:#1D4ED8;border-color:rgba(37,99,235,.25)}
.b-gray{background:#F8FAFC;color:#4B5563;border-color:#E2E8F0}
.b-teal{background:#F0FDFA;color:#0F766E;border-color:rgba(13,148,136,.25)}
/* ── 表格(对齐 KOL data-table) ── */
.data-table{width:100%;border-collapse:collapse}
.data-table th{font-size:10px;font-weight:500;color:#6B7280;text-align:left;padding:8px 12px;background:#F8FAFC;border-bottom:0.5px solid #E2E8F0;text-transform:uppercase;letter-spacing:.04em}
.data-table td{font-size:12px;color:#374151;padding:9px 12px;border-bottom:0.5px solid #F1F5F9;vertical-align:middle}
.data-table tr:last-child td{border-bottom:none}
.data-table tr:hover td{background:#FAFAFA}
.data-table a{color:#0D9488;text-decoration:none}
.data-table a:hover{text-decoration:underline}
/* ── 筛选栏 ── */
.filter-bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-bar select,.filter-bar input{font-size:11px;padding:5px 8px;border:0.5px solid #E2E8F0;border-radius:5px;background:#fff;color:#374151;font-family:inherit;outline:none;height:30px}
.filter-bar input{width:180px}
.filter-bar input:focus,.filter-bar select:focus{border-color:#0D9488;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.hub-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.hub-head h2{font-size:21px;color:#1B2B3C;margin-bottom:4px}.hub-head p{font-size:11px;color:#64748B}.hub-tabs{display:flex;gap:4px;background:#E2E8F0;padding:3px;border-radius:7px}.hub-tabs button{border:0;background:transparent;color:#64748B;font-size:10px;padding:6px 11px;border-radius:5px;cursor:pointer}.hub-tabs button.active{background:#fff;color:#0F766E;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.home-hero{background:linear-gradient(125deg,#172A3D 0%,#213D50 62%,#176B69 145%);color:#fff;border-radius:12px;padding:20px 22px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:18px;overflow:hidden;position:relative}.home-hero:after{content:'';position:absolute;width:220px;height:220px;border:42px solid rgba(94,234,212,.07);border-radius:50%;right:-65px;top:-105px}.home-hero h2{font-size:21px;margin-bottom:5px}.home-hero p{font-size:11px;color:#B8C6D2}.home-actions{display:flex;gap:8px;position:relative;z-index:1}.home-actions .tb-btn{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.1);color:#fff}.home-actions .tb-btn.teal{background:#0D9488;border-color:#0D9488}.home-metric{position:relative;min-height:108px;padding:16px 16px 14px}.home-metric-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;position:absolute;right:14px;top:14px}.home-metric .mc-num{font-size:25px;margin:8px 0}.home-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.8fr);gap:12px;margin-bottom:12px}.portfolio-body{padding:13px 15px}.portfolio-row{display:grid;grid-template-columns:105px 1fr 34px;gap:10px;align-items:center;padding:8px 0}.portfolio-label{font-size:10px;color:#475569}.portfolio-track{height:7px;background:#E7EDF3;border-radius:999px;overflow:hidden}.portfolio-fill{height:100%;background:#0D9488;border-radius:999px}.portfolio-value{font-size:10px;font-weight:700;text-align:right}.risk-focus{padding:4px 14px}.risk-focus-item{padding:11px 0;border-bottom:1px solid #F1F5F9}.risk-focus-item:last-child{border:0}.risk-focus-title{font-size:11px;font-weight:600;margin:5px 0 3px}.risk-focus-meta{font-size:9px;color:#94A3B8}.home-status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px}.home-status-item{background:#F8FAFC;border-radius:7px;padding:10px}.home-status-item span{display:block;font-size:9px;color:#94A3B8;margin-bottom:4px}.home-status-item b{font-size:11px;color:#334155}@media(max-width:1000px){.home-layout{grid-template-columns:1fr}}@media(max-width:680px){.home-hero{align-items:flex-start;flex-direction:column}.home-status{grid-template-columns:1fr}}
.home-positioning-kicker{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#5EEAD4;margin-bottom:7px}.home-role-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:3px 0 9px}.home-role-head h3{font-size:13px;color:#1B2B3C}.home-role-head p{font-size:9px;color:#94A3B8}.persona-grid,.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.persona-card,.scenario-card{background:#fff;border:1px solid #E2E8F0;border-radius:9px;padding:14px;cursor:pointer;transition:transform .15s ease,border-color .15s ease,box-shadow .15s ease}.persona-card:hover,.scenario-card:hover{transform:translateY(-2px);border-color:#5EEAD4;box-shadow:0 8px 20px rgba(15,118,110,.08)}.persona-top,.scenario-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.persona-card h4,.scenario-card h4{font-size:12px;color:#172033;margin:8px 0 5px}.persona-card p,.scenario-card p{font-size:9px;line-height:1.6;color:#64748B}.persona-outcome{margin-top:9px;padding-top:8px;border-top:1px solid #F1F5F9;color:#0F766E!important}.persona-cta,.scenario-cta{display:block;margin-top:9px;font-size:9px;font-weight:600;color:#0D9488}.scenario-number{width:25px;height:25px;border-radius:7px;background:#E6FFFB;color:#0F766E;display:grid;place-items:center;font-size:9px;font-weight:700}.scenario-limit{margin-top:7px;padding:7px 8px;border-radius:6px;background:#F8FAFC}.home-differentiators{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:13px 14px}.home-differentiator{padding:10px;border-radius:7px;background:#F8FAFC;border-left:2px solid #14B8A6}.home-differentiator b{display:block;font-size:10px;color:#334155;margin-bottom:4px}.home-differentiator span{display:block;font-size:8px;color:#64748B;line-height:1.5}@media(max-width:1000px){.persona-grid,.scenario-grid{grid-template-columns:1fr}.home-differentiators{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.home-role-head{align-items:flex-start;flex-direction:column}.home-differentiators{grid-template-columns:1fr}}
/* ── 表单 ── */
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:500;color:#374151;margin-bottom:3px}
.field input,.field select,.field textarea{width:100%;padding:7px 10px;border:0.5px solid #E2E8F0;border-radius:5px;background:#fff;color:#111827;font-size:13px;font-family:inherit;outline:none}
.field input:focus,.field select:focus{border-color:#0D9488;box-shadow:0 0 0 3px rgba(13,148,136,.1)}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* ── 通知 ── */
.sec-divider{font-size:11px;font-weight:600;color:#374151;margin:16px 0 10px;padding-bottom:6px;border-bottom:0.5px solid #F1F5F9;display:flex;align-items:center;gap:6px}
.empty-state{text-align:center;padding:48px 24px;color:#9CA3AF}
.empty-state .es-icon{font-size:36px;display:block;margin-bottom:10px;opacity:.4}
.empty-state p{font-size:13px;margin-bottom:14px}
.hint{font-size:10px;color:#9CA3AF;margin-bottom:3px;display:block}
.gap-row{background:#FEF2F2}
.toast{position:fixed;top:16px;right:16px;z-index:999;padding:10px 16px;border-radius:8px;font-size:13px;display:none;box-shadow:0 4px 16px rgba(0,0,0,.12)}
.toast.success{background:#ECFDF5;color:#047857;border:0.5px solid rgba(4,120,87,.25);display:block}
.toast.error{background:#FEF2F2;color:#991B1B;border:0.5px solid rgba(185,28,28,.25);display:block}
/* 升级弹窗 */
.upgrade-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center}
.upgrade-overlay.show{display:flex}
.upgrade-card{background:#fff;border-radius:12px;width:440px;max-width:94vw;padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.upgrade-card h3{font-size:18px;margin-bottom:8px;color:#111827}
.upgrade-card p{font-size:13px;color:#6B7280;margin-bottom:8px;line-height:1.6}
.upgrade-card .up-benefits{text-align:left;background:#F0FDFA;border-radius:8px;padding:12px 16px;margin:12px 0;font-size:12px;color:#0F766E;line-height:1.8}
.upgrade-card .up-btn{display:inline-block;padding:10px 28px;background:#0D9488;color:#fff;border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer;margin:6px;font-family:inherit}
.upgrade-card .up-btn.ghost{background:#fff;color:#6B7280;border:0.5px solid #E2E8F0}
.upgrade-card .up-btn:hover{opacity:.9}
/* 内容锁定遮罩 */
.locked{position:relative;overflow:hidden}
.locked::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.75);z-index:10;border-radius:inherit}
.locked-tag{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:11;text-align:center}
.locked-tag button{display:block;margin:8px auto 0;padding:8px 18px;background:#0D9488;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer;font-family:inherit}
/* ── 情报流 · Figma综合工作台 ── */
.intel-hero{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}.intel-hero h2{font-size:21px;line-height:1.25;margin-bottom:5px}.intel-hero p{font-size:11px;color:#64748B}.view-tabs{display:flex;background:#E2E8F0;border-radius:7px;padding:3px;gap:2px}.view-tabs button{border:0;background:transparent;color:#64748B;padding:5px 11px;border-radius:5px;font-size:10px;cursor:pointer}.view-tabs button.active{background:#fff;color:#0F766E;font-weight:600;box-shadow:0 1px 3px rgba(15,23,42,.08)}
.metric-card.with-icon{position:relative;min-height:112px;padding:16px}.metric-icon{position:absolute;right:14px;top:14px;width:31px;height:31px;border-radius:8px;display:grid;place-items:center;font-size:13px}.mi-blue{background:#EFF6FF;color:#2563EB}.mi-red{background:#FEF2F2;color:#DC2626}.mi-teal{background:#F0FDFA;color:#0D9488}.mi-amber{background:#FFFBEB;color:#D97706}.metric-trend{margin-top:9px;font-size:10px;color:#0D9488}
.intel-layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,.8fr);gap:12px;margin-bottom:12px}.intel-feed-item{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;padding:13px 14px;border-bottom:1px solid #F1F5F9}.intel-feed-item:last-child{border-bottom:0}.feed-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:600}.feed-title{display:block;color:#172033;font-size:12px;font-weight:600;text-decoration:none;margin:5px 0 3px}.feed-title:hover{color:#0D9488}.feed-summary{font-size:10px;color:#64748B;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feed-meta{font-size:9px;color:#94A3B8;margin-top:4px}.risk-list{padding:12px 14px}.risk-row{margin-bottom:13px}.risk-row:last-child{margin-bottom:0}.risk-label{display:flex;justify-content:space-between;font-size:10px;color:#374151;margin-bottom:5px}.risk-track{height:5px;background:#E2E8F0;border-radius:999px;overflow:hidden}.risk-fill{height:100%;border-radius:999px}.daily-advice{margin:14px;background:#F8FAFC;border-radius:7px;padding:11px;font-size:10px;line-height:1.65;color:#334155}.daily-advice span{display:block;color:#94A3B8;margin-bottom:3px}.section-link{font-size:10px;color:#0D9488;text-decoration:none;cursor:pointer}.score-cell{font-weight:700;color:#0F766E}.intel-table-card{margin-top:12px}
.saved-search-card{margin-bottom:12px}.saved-search-list{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px 14px}.saved-search-item{border:1px solid #E2E8F0;border-radius:8px;padding:11px;background:#fff}.saved-search-item.paused{background:#F8FAFC;opacity:.75}.saved-search-item h4{font-size:11px;margin:6px 0}.saved-search-meta{font-size:9px;color:#64748B;line-height:1.7;min-height:31px}.saved-search-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.saved-search-form{display:grid;grid-template-columns:1.1fr 1.2fr .8fr .9fr .7fr auto;gap:7px;padding:13px 14px;align-items:end}.saved-search-form .field{margin:0}.saved-search-form input,.saved-search-form select{height:32px}@media(max-width:1050px){.saved-search-list{grid-template-columns:1fr}.saved-search-form{grid-template-columns:1fr 1fr}}@media(max-width:680px){.saved-search-form{grid-template-columns:1fr}}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.intel-layout{grid-template-columns:1fr}}@media(max-width:680px){.sidebar{width:58px}.nav-logo>div:last-child,.nav-item{font-size:0}.nav-item{justify-content:center;padding:12px 0}.nav-item .ni{font-size:15px}.nav-footer{display:none}.content{padding:14px}.grid4,.grid3,.grid2{grid-template-columns:1fr}.topbar{padding:0 12px}.intel-hero{gap:10px}}
/* ── 法规库 · 主表与详情 ── */
.reg-page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.reg-page-head h2{font-size:21px;margin-bottom:5px}.reg-page-head p{font-size:11px;color:#64748B}.reg-tabs{display:flex;background:#E2E8F0;border-radius:7px;padding:3px}.reg-tabs button{border:0;background:transparent;padding:6px 12px;border-radius:5px;color:#64748B;font-size:10px;cursor:pointer}.reg-tabs button.active{background:#fff;color:#0F766E;font-weight:600}.reg-toolbar{display:grid;grid-template-columns:minmax(220px,1fr) repeat(4,auto);gap:8px;margin-bottom:12px}.reg-toolbar input,.reg-toolbar select{height:34px;border:1px solid #E2E8F0;border-radius:6px;background:#fff;padding:0 10px;color:#475569;font-size:11px;outline:none}.reg-toolbar input:focus,.reg-toolbar select:focus{border-color:#0D9488;box-shadow:0 0 0 3px rgba(13,148,136,.08)}.reg-layout{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:12px;align-items:start}.reg-table-card{min-height:660px}.reg-table-row{cursor:pointer}.reg-table-row.selected td{background:#F0FDFA}.reg-title{font-size:11px;font-weight:650;color:#172033}.reg-number{font-size:9px;color:#94A3B8;margin-top:2px}.reg-detail-panel{position:sticky;top:0}.reg-detail-body{padding:14px}.reg-detail-body h3{font-size:16px;margin:8px 0 2px}.reg-detail-summary{font-size:11px;color:#64748B;line-height:1.7;margin:9px 0 12px}.reg-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.reg-fact{background:#F8FAFC;border-radius:7px;padding:9px}.reg-fact span{display:block;font-size:9px;color:#94A3B8}.reg-fact b{display:block;margin-top:4px;font-size:11px}.material-check{display:flex;gap:9px;padding:10px 0;border-bottom:1px solid #F1F5F9}.material-check:last-child{border-bottom:0}.material-box{width:15px;height:15px;border:1px solid #CBD5E1;border-radius:4px;display:grid;place-items:center;color:#059669;font-size:10px;flex-shrink:0}.material-name{font-size:10px;font-weight:600}.material-meta{font-size:9px;color:#94A3B8;margin-top:3px}.risk-legend{margin-top:12px}.legend-row{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid #F1F5F9;font-size:9px;color:#64748B}.legend-row:last-child{border:0}

<script>
// ── 权限 ──
let _tier='free';  // 兼容现有页面判断；值由后端登录态决定
let _identity=null;
const _TIER_LABEL={free:'免费用户',pro:'专业版',ent:'企业版'};
function _can(perm){if(_tier==='ent')return true;if(_tier==='pro')return perm!=='ent_only';return false;}
function _hasPerm(permission){return !!_identity?.permissions?.includes(permission);}
function _accessState(capability){return _identity?.access?.capabilities?.[capability]||{state:'H',required_plan:'professional',required_plan_label:'专业版'};}
const _nativeFetch=window.fetch.bind(window);
async function _apiFetch(input,init={}){
  const token=localStorage.getItem('access_token');
  const headers=new Headers(init.headers||{});if(token)headers.set('Authorization','Bearer '+token);
  let response=await _nativeFetch(input,{...init,headers});
  if(response.status===401&&localStorage.getItem('refresh_token')&&!String(input).includes('/api/auth/')){
    const rr=await _nativeFetch('/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:localStorage.getItem('refresh_token')})});
    if(rr.ok){const d=await rr.json();_saveAuth(d);headers.set('Authorization','Bearer '+d.access_token);response=await _nativeFetch(input,{...init,headers});}
    else _clearAuth();
  }
  return response;
}
window.fetch=_apiFetch;
function _saveAuth(d){localStorage.setItem('access_token',d.access_token);if(d.refresh_token)localStorage.setItem('refresh_token',d.refresh_token);_applyIdentity(d);}
function _clearAuth(){localStorage.removeItem('access_token');localStorage.removeItem('refresh_token');_identity=null;_tier='free';_renderAuth();}
function _applyIdentity(d){_identity=d;_tier=d.plan==='professional'?'pro':['enterprise','special_service'].includes(d.plan)?'ent':'free';_renderAuth();}

function _donut(pct,color,label,sub){const r=38,c=2*Math.PI*r,offset=c*(1-pct/100);return '<div style=\"text-align:center\"><svg width=\"110\" height=\"100\" viewBox=\"0 0 110 100\"><circle cx=\"55\" cy=\"45\" r=\"'+r+'\" fill=\"none\" stroke=\"#F1F5F9\" stroke-width=\"10\"/><circle cx=\"55\" cy=\"45\" r=\"'+r+'\" fill=\"none\" stroke=\"'+color+'\" stroke-width=\"10\" stroke-dasharray=\"'+c+'\" stroke-dashoffset=\"'+offset+'\" stroke-linecap=\"round\" transform=\"rotate(-90 55 45)\" style=\"transition:stroke-dashoffset 1s ease\"/><text x=\"55\" y=\"43\" text-anchor=\"middle\" font-size=\"18\" font-weight=\"700\" fill=\"#111827\">'+pct+'%</text><text x=\"55\" y=\"60\" text-anchor=\"middle\" font-size=\"10\" fill=\"#9CA3AF\">'+label+'</text></svg>'+(sub?'<div style=\"font-size:10px;color:#9CA3AF;margin-top:-6px\">'+sub+'</div>':'')+'</div>';}
// ── SVG 柱状图(纯 JS 拼接,避免模板字符串嵌套问题)──
function _barChart(items,colors){
  var w=420,h=180,lw=70,bw=Math.max(16,Math.floor((w-lw-20)/items.length-6));
  var max=1;for(var i=0;i<items.length;i++){max=Math.max(max,items[i][1]);}
  var html='<svg width=\"'+w+'\" height=\"'+h+'\" viewBox=\"0 0 '+w+' '+h+'\" style=\"width:100%\"><line x1=\"'+(lw-2)+'\" y1=\"10\" x2=\"'+(lw-2)+'\" y2=\"'+(h-20)+'\" stroke=\"#E2E8F0\" stroke-width=\"0.5\"/>';
  for(var i=0;i<items.length;i++){
    var bh=Math.max(4,(items[i][1]/max)*(h-40));
    var x=lw+i*(bw+6);var y=h-bh-20;
    html+='<rect x=\"'+x+'\" y=\"'+y+'\" width=\"'+bw+'\" height=\"'+bh+'\" fill=\"'+(colors[i]||'#0D9488')+'\" rx=\"3\" opacity=\"0.9\"/>';
    html+='<text x=\"'+(x+bw/2)+'\" y=\"'+(h-4)+'\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7280\">'+items[i][0]+'</text>';
    html+='<text x=\"'+(x+bw/2)+'\" y=\"'+(y-6)+'\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"600\" fill=\"#374151\">'+items[i][1]+'</text>';
  }
  return html+'</svg>';
}

  _projectFiltered=_projectAll.filter(p=>{const value=Number(p.contract_value)||0,score=Number(p.total_score)||0;return(!kw||(p.project_name+p.contracting_authority+p.country).toLowerCase().includes(kw))&&(!country||p.country===country)&&(!type||p.project_type===type)&&(!budget||(budget==='large'&&value>=10000000)||(budget==='medium'&&value>=1000000&&value<10000000)||(budget==='small'&&value<1000000))&&(!match||(match==='high'&&score>=80)||(match==='medium'&&score>=70&&score<80)||(match==='low'&&score<70));});

async function showProjectScoring(id){
  if(!_hasPerm('project.scoring_detail')){_lockUpgrade('七维评分明细(专业版)','查看每个维度的具体打分、权重计算依据及一票否决详情,助您快速判断是否值得投入。',['7大维度完整评分','权重计算依据','一票否决详情','评分规则版本追溯']);return;}
  try{
  const d=await fetch('/api/projects/'+id+'/scoring').then(r=>{if(!r.ok)throw new Error(r.status);return r.json();});
  const lb=_levelBadge(d.project_level);
  let panel=document.getElementById('scoringPanel');
  if(!panel){panel=document.createElement('div');panel.id='scoringPanel';document.getElementById('mainContent').after(panel);}
  // SVG 雷达图(七边形)
  const cx=140,cy=140,r=110,levels=5;
  const angles=d.dimensions.map((_,i)=>-Math.PI/2+(2*Math.PI*i)/d.dimensions.length);
  const pts=d.dimensions.map((dm,i)=>{const pct=dm.pct/100;return [cx+r*pct*Math.cos(angles[i]),cy+r*pct*Math.sin(angles[i])];});
  const polyPts=pts.map(([x,y])=>`${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
  // 网格圈
  let rings='';
  for(let l=1;l<=levels;l++){const pts2=angles.map(a=>{const rr=r*l/5;return `${(cx+rr*Math.cos(a)).toFixed(1)},${(cy+rr*Math.sin(a)).toFixed(1)}`;});rings+=`<polygon points="${pts2.join(' ')}" fill="none" stroke="#E2E8F0" stroke-width="0.5"/>`;}
  // 轴线
  let axes=angles.map(a=>`<line x1="${cx}" y1="${cy}" x2="${(cx+r*Math.cos(a)).toFixed(1)}" y2="${(cy+r*Math.sin(a)).toFixed(1)}" stroke="#E2E8F0" stroke-width="0.5"/>`).join('');
  // 标签
  let labels=d.dimensions.map((dm,i)=>{const lx=cx+(r+22)*Math.cos(angles[i]),ly=cy+(r+22)*Math.sin(angles[i]);return `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#6B7280">${dm.name}</text>`;}).join('');
  const scoreColor=d.has_veto?'#DC2626':d.project_level==='优先跟进'?'#0D9488':d.project_level==='持续观察'?'#D97706':'#6B7280';

  panel.style.display='block';
  panel.innerHTML=`
    <div class="card"><div class="card-head"><div class="ch-title">📊 ${d.project_name} — 七维评分</div><div><span class="badge b-gray">综合 ${d.total_score} 分</span> <span class="badge ${_levelBadge(d.project_level)}">${d.project_level}</span> ${d.has_veto?`<span class="badge b-red">⚠ 一票否决: ${d.veto_reasons.join('；')}</span>`:''}</div></div>
    <div class="grid2">
      <div style="background:#fff;border:0.5px solid #E2E8F0;border-radius:9px;padding:10px;display:flex;align-items:center;justify-content:center">
        <svg width="300" height="300" viewBox="0 0 280 280">
          ${rings}${axes}${labels}
          <polygon points="${polyPts}" fill="${scoreColor}" fill-opacity="0.18" stroke="${scoreColor}" stroke-width="2"/>
          ${pts.map(([x,y])=>`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${scoreColor}"/>`).join('')}
        </svg>
      </div>
      <div class="card"><table class="data-table">
        <tr><th>评分维度</th><th>得分</th><th>满分</th><th>占比</th></tr>
        ${d.dimensions.map(dm=>`<tr><td>${dm.name}</td><td><b>${dm.score}</b></td><td>${dm.max}</td><td><div style="background:#F1F5F9;border-radius:3px;height:6px;width:100%"><div style="background:${scoreColor};border-radius:3px;height:6px;width:${dm.pct}%"></div></div><span style="font-size:10px;color:#9CA3AF;margin-left:6px">${dm.pct}%</span></td></tr>`).join('')}
      </table></div>
    </div>
    <div style="margin-top:8px"><button class="tb-btn" onclick="document.getElementById('scoringPanel').style.display='none';window.scrollTo(0,0)">收起评分详情</button></div>
    </div>`;
  }catch(err){ console.error('评分加载失败:',err); alert('评分加载失败: '+err.message); }
}

const _SCORE_OPTS={
  scale_score:{name:'项目规模',max:15,opts:{15:'超1000万€',12:'500-1000万€',9:'100-500万€',6:'20-100万€',3:'<20万€'}},
  authority_score:{name:'采购主体',max:10,opts:{10:'欧盟/NATO',8:'国家部委',6:'大区/省级',4:'市级',2:'学校/医院'}},
  technical_score:{name:'技术匹配度',max:20,opts:{20:'成熟方案+欧洲案例',16:'核心匹配 少量定制',12:'方向匹配 需大改',8:'部分模块匹配',4:'基本不匹配'}},
  compliance_score:{name:'合规可行性',max:15,opts:{15:'认证齐全 可直接参与',12:'缺1-2项 短期可补',9:'缺3项以上',6:'需本地伙伴',3:'非EU企业限制'}},
  local_score:{name:'本地合作可行性',max:10,opts:{10:'无强制本地要求',8:'建议本地合作',6:'有分包 已有伙伴',4:'有分包 需重新找',2:'须本地注册/合资'}},
  conversion_score:{name:'商业转化潜力',max:20,opts:{20:'标杆+复购+生态',16:'标杆案例 可复制',12:'单个项目价值',8:'与主业关联弱',4:'无转化价值'}},
  competition_score:{name:'竞争格局',max:10,opts:{10:'≤3家',8:'4-6家 有差异化',6:'7-10家 有头部',4:'>10家 激烈',2:'被少数企业垄断'}},
};
function _calcScore(){
  let total=0;
  Object.keys(_SCORE_OPTS).forEach(k=>{const el=document.getElementById('s_'+k);if(el)total+=parseInt(el.value)||0;});
  const sc=document.getElementById('scoreTotal');if(sc){sc.textContent=total;const lv=total>=70?'优先跟进':total>=50?'持续观察':'暂缓投入';sc.style.color=lv==='优先跟进'?'#0D9488':lv==='持续观察'?'#D97706':'#DC2626';}
  const vetoEl=document.getElementById('vetoCheck');if(vetoEl){
    const comp=parseInt(document.getElementById('s_compliance_score')?.value)||0;
    const tech=parseInt(document.getElementById('s_technical_score')?.value)||0;
    const comp2=parseInt(document.getElementById('s_competition_score')?.value)||0;
    const veto=comp<4||tech<5||comp2<3;
    vetoEl.innerHTML=veto?'<span class="badge b-red">⚠ 触发一票否决 (合规<4 或 技术<5 或 竞争<3)</span>':'<span class="badge b-green">未触发一票否决</span>';
  }
}

async function submitProject(){
  if(!_hasPerm('project.create')){_lockUpgrade('创建项目工作台(专业版)','将情报转化为专属项目工作台，即可启动评分、任务分配与团队协作。',['建立唯一Project ID','开启闭环管理','七维评分+一票否决','团队协作与任务分配']);return;}
  const get=(id)=>document.getElementById(id)?.value||'';
  const body={
    project_name:get('np_name'),country:get('np_country'),project_type:get('np_type'),
    contracting_authority:get('np_authority'),contract_value:parseFloat(get('np_value'))||0,
    deadline:get('np_deadline'),source_url:get('np_source'),description:get('np_desc'),stage:get('np_stage'),
    scale_score:parseInt(get('s_scale_score'))||3,authority_score:parseInt(get('s_authority_score'))||3,
    technical_score:parseInt(get('s_technical_score'))||3,compliance_score:parseInt(get('s_compliance_score'))||3,
    local_score:parseInt(get('s_local_score'))||3,conversion_score:parseInt(get('s_conversion_score'))||3,
    competition_score:parseInt(get('s_competition_score'))||3,
  };
  if(!body.project_name||!body.country||!body.contracting_authority){alert('请填写项目名称/国家/采购主体');return;}
  if(body.contract_value<0){alert('合同金额不能为负数');return;}
  if(body.source_url&&!body.source_url.startsWith('http')){alert('来源链接需以 http/https 开头');return;}
  try{
    const r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json();throw new Error(e.detail||r.status);}
    const d=await r.json();
    toast(`项目已保存 · 得分 ${d.total_score} · ${d.project_level}`);
    // 清空项目缓存,下次刷新
    _regAll=[]; _regs=[];
    setTimeout(()=>navigate('projects'),800);
  }catch(e){alert('保存失败: '+e.message);}
}

const _PROJ_REG_MAP={

  '机场交通':['准入认证','电池合规','网络安全','排放合规','安全测评'],

// ── 启动（支持 RAG 证据卡片通过 ?page= 深链返回对应业务页）──
const _initialPage=new URLSearchParams(location.search).get('page');
if(_initialPage){const route=_resolveRoute(_initialPage);currentPage=route.page;if(route.tab&&_hubTab[currentPage]!==undefined)_hubTab[currentPage]=route.tab;}
buildNav();
document.getElementById('pageTitle').textContent=PAGE_TITLES[currentPage]||'开源情报平台';
_initAuth().then(()=>loadPage(currentPage));
</script>
</body>
